<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Addiction Brain &middot; 成癮醫學文獻日報</title>
<style>
  :root { --bg: #0f1117; --surface: #1a1d27; --line: #2a2d3a; --text: #e8e6e3; --muted: #9ca3af; --accent: #22d3ee; --accent-soft: rgba(34,211,238,0.12); }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: linear-gradient(135deg, #0f1117 0%, #1a1040 50%, #0f1117 100%); color: var(--text); font-family: "Noto Sans TC", "PingFang TC", "Helvetica Neue", Arial, sans-serif; min-height: 100vh; }
  .container { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding: 80px 24px; }
  .logo { font-size: 48px; text-align: center; margin-bottom: 16px; }
  h1 { text-align: center; font-size: 24px; color: var(--text); margin-bottom: 8px; }
  .subtitle { text-align: center; color: var(--accent); font-size: 14px; margin-bottom: 48px; }
  .count { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 32px; }
  .msg { text-align: center; color: var(--muted); font-size: 15px; padding: 32px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 24px; }
  footer { margin-top: 56px; text-align: center; font-size: 12px; color: var(--muted); }
  footer a { display: inline; padding: 0; background: none; border: none; color: var(--muted); }
  footer a:hover { color: var(--accent); }
</style>
</head>
<body>
<div class="container">
  <div class="logo">🧠</div>
  <h1>Addiction Brain</h1>
  <p class="subtitle">成癮醫學文獻日報 &middot; 每日自動更新</p>
  <div class="msg">
    <p>🚀 首份報告將由 GitHub Actions 自動生成</p>
    <p style="margin-top:8px;font-size:12px;color:var(--muted)">每日台北時間 11:00 自動執行</p>
  </div>
  <footer>
    <p>Powered by PubMed + Zhipu AI &middot; <a href="https://github.com/u8901006/addiction-brain">GitHub</a></p>
    <p style="margin-top:8px"><a href="https://www.leepsyclinic.com/" target="_blank">🏥 李政洋身心診所</a> &middot; <a href="https://blog.leepsyclinic.com/" target="_blank">📨 訂閱電子報</a></p>
  </footer>
</div>
</body>
</html>
